<div class="row">
    <div class="col-12 col-md-8">
        <h2>Register</h2>
        <form (ngSubmit)="onRegisterSubmit()">
            <div role="alert" *ngIf="formError" class="alert alert-danger">{{ formError }}</div>
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="Enter name" [(ngModel)]="credentials.name">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Enter email address" [(ngModel)]="credentials.email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" [(ngModel)]="credentials.password">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" [(ngModel)]="credentials.confirmPassword">
            </div>
            <button type="submit" role="button" class="btn btn-primary">Register</button>
            <p class="mt-3">Already have an account? <a routerLink="/login">Log in</a></p>
        </form>
    </div>
</div>
